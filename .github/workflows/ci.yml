name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylesheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site.css files are committed so GitHub Pages needs no build step.
      # That only holds while they match the markup, so rebuild and compare:
      # a diff here means someone changed classes without running build:css.
      - name: Rebuild stylesheets
        run: npm run build:css

      - name: Stylesheets must be up to date
        run: |
          if ! git diff --quiet -- '*.css'; then
            echo "::error::site.css is stale. Run 'npm run build:css' and commit the result."
            git diff --stat -- '*.css'
            exit 1
          fi
          echo "Alle Stylesheets sind aktuell."
